<!-- -*- coding: utf-8 -*- -->
{% extends 'base.html' %}

{% block content %}
<h3>تعديل المستخدم</h3>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="mb-3">
    <label class="form-label">اسم المستخدم</label>
    <input name="username" class="form-control" value="{{ user.username }}" disabled>
  </div>
  <div class="mb-3">
    <label class="form-label">الدور</label>
    <select name="role" class="form-select">
      <option value="teacher" {% if user.role=='teacher' %}selected{% endif %}>معلم</option>
      <option value="admin" {% if user.role=='admin' %}selected{% endif %}>مدير</option>
    </select>
  </div>
  <button class="btn btn-primary">حفظ</button>
  <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">إلغاء</a>
</form>
{% endblock %}
