<!-- -*- coding: utf-8 -*- -->
{% extends 'base.html' %}

{% block content %}
<h3>الحضور والغياب</h3>
<div class="row">
  <div class="col-md-6">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">الطالب</label>
        <select name="student_id" class="form-select">
          {% for s in students %}
            <option value="{{ s.id }}">{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">الحالة</label>
        <select name="status" class="form-select">
          <option value="حاضر">حاضر</option>
          <option value="غائب">غائب</option>
        </select>
      </div>
      <button class="btn btn-success">تسجيل</button>
    </form>
  </div>

  <div class="col-md-6">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>الطالب</th>
          <th>التاريخ</th>
          <th>الحالة</th>
        </tr>
      </thead>
      <tbody>
        {% for a in attendance %}
          <tr>
            <td>{{ a.student.name if a.student else a.student_id }}</td>
            <td>{{ a.date }}</td>
            <td>{{ a.status }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
