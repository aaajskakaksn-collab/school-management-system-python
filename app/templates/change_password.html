<!-- -*- coding: utf-8 -*- -->
{% extends 'base.html' %}

{% block content %}
<h3>تغيير كلمة المرور</h3>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="mb-3">
    <label class="form-label">كلمة المرور القديمة</label>
    <input name="old_password" class="form-control" type="password" required>
  </div>
  <div class="mb-3">
    <label class="form-label">كلمة المرور الجديدة</label>
    <input name="new_password" class="form-control" type="password" required>
  </div>
  <button class="btn btn-primary">حفظ</button>
  <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">إلغاء</a>
</form>
{% endblock %}
