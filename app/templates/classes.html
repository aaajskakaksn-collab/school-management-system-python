<!-- -*- coding: utf-8 -*- -->
{% extends 'base.html' %}

{% block content %}
<h3>الصفوف</h3>
<div class="row">
  <div class="col-md-6">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">اسم الصف</label>
        <input name="name" class="form-control" required>
      </div>
      <button class="btn btn-success">إضافة</button>
    </form>
  </div>

  <div class="col-md-6">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>اسم الصف</th>
          <th>عدد الطلاب</th>
        </tr>
      </thead>
      <tbody>
        {% for c in classes %}
          <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.students|length }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
