<!-- -*- coding: utf-8 -*- -->
{% extends 'base.html' %}

{% block content %}
<h3>الدرجات</h3>
<div class="row">
  <div class="col-md-6">
    <h5>إضافة درجة</h5>
    <form method="post" action="{{ url_for('admin.grades') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">الطالب</label>
        <select name="student_id" class="form-select">
          {% for s in students %}
            <option value="{{ s.id }}">{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">المادة</label>
        <select name="subject_id" class="form-select">
          {% for sub in subjects %}
            <option value="{{ sub.id }}">{{ sub.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">الدرجة</label>
        <input name="value" class="form-control" required>
      </div>
      <button class="btn btn-success">إضافة درجة</button>
    </form>
  </div>

  <div class="col-md-6">
    <h5>قائمة الدرجات</h5>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>الطالب</th>
          <th>المادة</th>
          <th>الدرجة</th>
          <th>التاريخ</th>
        </tr>
      </thead>
      <tbody>
        {% for g in grades %}
          <tr>
            <td>{{ g.student.name if g.student else g.student_id }}</td>
            <td>{{ g.subject.name if g.subject else g.subject_id }}</td>
            <td>{{ g.value }}</td>
            <td>{{ g.date }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
