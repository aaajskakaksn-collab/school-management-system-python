<!-- -*- coding: utf-8 -*- -->
{% extends 'base.html' %}

{% block content %}
<h3>تعديل بيانات الطالب</h3>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="mb-3">
    <label class="form-label">الاسم</label>
    <input name="name" class="form-control" value="{{ student.name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">البريد الإلكتروني</label>
    <input name="email" class="form-control" value="{{ student.email }}">
  </div>
  <div class="mb-3">
    <label class="form-label">الصف</label>
    <select name="class_id" class="form-select">
      <option value="">-- اختر الصف --</option>
      {% for c in classes %}
        <option value="{{ c.id }}" {% if student.class_id == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-primary">حفظ</button>
  <a href="{{ url_for('admin.students') }}" class="btn btn-secondary">إلغاء</a>
</form>
{% endblock %}
